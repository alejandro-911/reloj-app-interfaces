<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Para usar el ancho real de la pantalla del dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Time</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <!-- Iconos -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <!-- Fuente Roboto --> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <nav>
      <ul>
        <li>
          <a href="#clock">
            <span class="material-icons">schedule</span>
            <span class="label">Clock</span>
          </a>
        </li>
        <li>
          <a href="#alarm">
            <span class="material-icons">alarm</span>
            <span class="label">Alarm</span>
          </a>
        </li>
        <li>
          <a href="#stopwatch">
            <span class="material-icons">timer</span>
            <span class="label">Stopwatch</span>
          </a>
        </li>
        <li><a href="#timer">
          <span class="material-icons">hourglass_empty</span>
          <span class="label">Timer</span>
        </a>
      </li>
      </ul>
    </nav>

    <main>
      <section id="clock">
        <x-clock>
          <time>00:00:00</time>
        </x-clock>
      </section>
      <section id="alarm">
        <x-alarm>
          <template>
            <section class="alarms">
              <input type="time" min="00:00" max="23:59" step="1" />
              <section class="controls">
                <button class="start material-icons" title="Activar alarma">alarm_on</button>
                <button class="pause material-icons" title="Desactivar alarma">alarm_off</button>
                <button class="delete material-icons" title="Eliminar alarma">delete</button>
              </section>
            </section>
          </template>
          <section class="items"></section> <!-- items es el contenedor de las tarjetas de alarmas hechas con la plantilla con JS que las mete en este contenedor, entonces, la clase items es la que llamamos en CSS -->
          <section class="controls">
            <button class="add material-icons" title="Añadir alarma">add_alarm</button>
          </section>
        </x-alarm>
      </section>
      <section id="stopwatch">
        <x-stopwatch>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="controls">
            <button class="start material-icons" title="Iniciar" aria-label="Iniciar">timer</button>
            <button class="pause material-icons" title="Pausar" aria-label="Pausar">timer_off</button>
            <button class="restart material-icons" title="Reiniciar" aria-label="Reiniciar">restart_alt</button>
          </section>
        </x-stopwatch>
      </section>
      <section id="timer">
        <x-timer>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="items">
            <section class="timers">
              <input
                type="time"
                min="00:00:00"
                max="23:59:59"
                value="00:03:00"
                step="1"
              />
              <input
                type="time"
                min="00:00:00"
                max="23:59:59"
                value="00:01:00"
                step="1"
              />
            </section>
          </section>
          <section class="controls">
            <button class="start material-icons" title="Iniciar" aria-label="Iniciar">timer</button>
            <button class="pause material-icons" title="Pausar" aria-label="Pausar">timer_off</button>
            <button class="restart material-icons" title="Reiniciar" aria-label="Reiniciar">restart_alt</button>
            <button class="loop material-icons" title="Activar repetición" aria-label="Activar repetición">loop</button>
            <button class="no-loop material-icons" title="Desactivar repetición" aria-label="Desactivar repetición">sync_disabled</button>
          </section>
        </x-timer>
      </section>
    </main>
    <audio id="alarm-sound">
      <source src="/public/alarm.ogg" type="audio/ogg; codecs=opus" />
      <source src="/public/alarm.mp3" type="audio/mpeg" />
    </audio>
    <audio id="timer-sound">
      <source src="/public/timer.ogg" type="audio/ogg; codecs=opus" />
      <source src="/public/timer.mp3" type="audio/mpeg" />
    </audio>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
